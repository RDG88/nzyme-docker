name: Nzyme Docker images

on:
  push:
    branches:
      - 'main'

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Preview bake plan
        run: |
          echo "IMAGE_REGISTRY_PREFIX=${IMAGE_REGISTRY_PREFIX}"
          docker buildx bake --print -f ./docker-bake.hcl
        env:
          IMAGE_REGISTRY_PREFIX: ${{ secrets.IMAGE_REGISTRY_PREFIX }}


      - name: Build and push
        uses: docker/bake-action@v5
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_REGISTRY_PREFIX: ${{ secrets.IMAGE_REGISTRY_PREFIX }}
        with:
          push: true
          targets: all_nzyme_nodes,all_nzyme_taps  # Fixed comma spacing if needed
          files: |
            ./docker-bake.hcl
